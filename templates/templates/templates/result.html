{% extends 'base.html' %}
{% block content %}
<div class="card result-card">
    <h2>Test Completed!</h2>
    <div class="score-circle">
        <span class="score-number">{{ result.percentage }}%</span>
    </div>
    <p class="score-summary">You scored <b>{{ result.score }}</b> out of <b>{{ result.total_questions }}</b></p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
